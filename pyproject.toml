[project]
name = "docinsight"
version = "0.1.0"
description = "FastAPI service for document Q&A with OCR and RAG"
readme = "README.md"
authors = [
    { name = "Dino Kotaranin", email = "dino.kotaranin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28,<2",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "fpdf2>=2.8.9",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert je u testovima ok
"scripts/**" = ["S311"]   # random je ovdje za testne podatke, ne za kriptografiju

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
untyped_calls_exclude = ["pymupdf"]   # PyMuPDF nema tipove na dijelu API-ja (no-untyped-call)

[[tool.mypy.overrides]]
module = ["easyocr", "easyocr.*"]
ignore_missing_imports = true         # easyocr lokalno nije instaliran i nema tipove

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
