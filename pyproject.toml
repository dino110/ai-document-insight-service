[project]
name = "docinsight"
version = "0.1.0"
description = "FastAPI service for document Q&A with OCR and RAG"
readme = "README.md"
authors = [
    { name = "Dino Kotaranin", email = "dino.kotaranin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.3",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28,<2",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "fpdf2>=2.8.9",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
ml = [
    "easyocr>=1.7 ; sys_platform == 'linux'",
    "torch>=2.6 ; sys_platform == 'linux'",
    "torchvision>=0.29.1 ; sys_platform == 'linux'",
]
ui = [
    "httpx2>=2.13.1",
    "streamlit>=1.66.1",
]

[tool.uv]
# Local `uv sync`/`uv run` include the UI. Docker images pick groups explicitly
# with --no-default-groups, so the API image never gets Streamlit.
default-groups = ["dev", "ui"]

# PyTorch from PyPI is a CUDA build on Linux (several GB of nvidia-* wheels).
# The CPU-only index is used for torch/torchvision and nothing else (explicit = true).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert je u testovima ok
"scripts/**" = ["S311"]   # random je ovdje za testne podatke, ne za kriptografiju

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "ui"]
untyped_calls_exclude = ["pymupdf"]   # PyMuPDF has no type hints on parts of its API (no-untyped-call)

[[tool.mypy.overrides]]
# Not installed locally (Linux-only `ml` group). faiss needs no override: it ships its own stubs.
module = ["easyocr", "easyocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ui", "scripts"]   # tests can `import api_client` (as Streamlit does) and scripts
addopts = "-ra"
markers = ["slow: treba pravi OCR (Docker)"]
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings on import, not by our code.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
